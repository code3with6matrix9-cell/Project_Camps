# ===============================================================
# = VOF BOOKING SYSTEM - APPLICATION PROPERTIES
# ===============================================================

# --- Server Configuration ---
server.port=${SERVER_PORT:8080}

# --- PostgreSQL Database Configuration ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- Cloudinary Configuration ---
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# --- Multipart File Upload Configuration ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Bootstrap Admin ---
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
app.bootstrap-admin.mobile-number=${BOOTSTRAP_ADMIN_MOBILE_NUMBER}

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.issuer=${JWT_ISSUER:vof-booking-api}
app.jwt.audience=${JWT_AUDIENCE:vof-booking-client}

# --- Refresh Token ---
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- Password OTP / SMS ---
app.password-otp.expiration-minutes=${PASSWORD_OTP_EXPIRATION_MINUTES:10}
app.password-otp.max-failed-attempts=${PASSWORD_OTP_MAX_FAILED_ATTEMPTS:5}
app.password-otp.request-cooldown-seconds=${PASSWORD_OTP_REQUEST_COOLDOWN_SECONDS:60}

app.sms.provider=${SMS_PROVIDER:none}

app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}